<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICN Security — RBAC</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/dashboard.css" /><link rel="stylesheet" href="../css/table.css" /><link rel="stylesheet" href="../css/modal.css" />
</head>
<body data-protected="true" data-page="rbac">
  <div class="toast-container" id="toastContainer"></div><div class="page-shell"><nav class="topbar"><div class="topbar-left"><button class="back-btn" onclick="goTo('dashboard')">Буцах</button><a class="topbar-logo" onclick="goTo('dashboard')"><div class="topbar-shield"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg></div><span class="topbar-title">ICN SECURITY</span></a><div class="topbar-div"></div><span class="topbar-sys">users + roles</span></div><div class="topbar-right"><span class="topbar-clock" data-clock></span><div class="user-badge"><div class="u-dot" data-user-dot></div><div><div class="u-name" data-user-name></div><div class="u-role" data-user-role></div></div></div><button class="logout-btn" onclick="doLogout()">Гарах</button></div></nav>
    <main class="content"><div class="breadcrumb"><span class="bc-link" onclick="goTo('dashboard')">Дашбоард</span><span>/</span><span>RBAC</span></div><div class="page-header"><div><div class="page-title">Хэрэглэгчийн эрх (RBAC)</div><div class="page-sub">ERD: users — username, password_hash, role_id FK | roles — role_name, permissions</div></div><button class="btn-add" onclick="openModal('userModal')">Хэрэглэгч нэмэх</button></div><div class="table-wrap" style="margin-bottom:18px"><div class="table-toolbar">roles collection</div><div class="table-scroll"><table><thead><tr><th>role</th><th>label</th><th>description</th><th>users</th></tr></thead><tbody id="rolesBody"></tbody></table></div></div><div class="rbac-grid" id="rbacGrid"></div></main><footer class="page-footer"><span>ICN</span><span>users + roles API</span></footer></div>
  <div class="overlay hidden" id="userModal"><div class="modal"><div class="modal-top-bar"></div><div class="modal-head"><div class="modal-title">Хэрэглэгч нэмэх — users</div><button class="modal-close" onclick="closeModal('userModal')">×</button></div><form onsubmit="submitUser(event)"><div class="modal-body"><div class="form-row"><div class="form-group"><label class="form-label">full_name</label><input class="form-input" id="userFullName" required /></div><div class="form-group"><label class="form-label">username</label><input class="form-input" id="userUsername" required /></div></div><div class="form-row"><div class="form-group"><label class="form-label">password</label><input class="form-input" id="userPassword" value="User@1234" required /></div><div class="form-group"><label class="form-label">expires_at</label><input type="date" class="form-input" id="userExpires" /></div></div><div class="form-row"><div class="form-group"><label class="form-label">role_id FK</label><select class="form-select" id="userRole"></select></div><div class="form-group"><label class="form-label">employee_id FK</label><select class="form-select" id="userEmployee"></select></div></div><div class="form-group"><label class="form-label">status</label><select class="form-select" id="userStatus"><option value="active">Идэвхтэй</option><option value="disabled">Идэвхгүй</option></select></div></div><div class="modal-foot"><button type="button" class="btn-cancel" onclick="closeModal('userModal')">Болих</button><button class="btn-save">Бүртгэх</button></div></form></div></div>
  <script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/users.js"></script>
</body>
</html>
