<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICN Security — Зочны бүртгэл</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/table.css" /><link rel="stylesheet" href="../css/modal.css" />
</head>
<body data-protected="true" data-page="visitors">
  <div class="toast-container" id="toastContainer"></div><div class="page-shell">
    <nav class="topbar"><div class="topbar-left"><button class="back-btn" onclick="goTo('dashboard')">Буцах</button><a class="topbar-logo" onclick="goTo('dashboard')"><div class="topbar-shield"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg></div><span class="topbar-title">ICN SECURITY</span></a><div class="topbar-div"></div><span class="topbar-sys">visitors</span></div><div class="topbar-right"><span class="topbar-clock" data-clock></span><div class="user-badge"><div class="u-dot" data-user-dot></div><div><div class="u-name" data-user-name></div><div class="u-role" data-user-role></div></div></div><button class="logout-btn" onclick="doLogout()">Гарах</button></div></nav>
    <main class="content"><div class="breadcrumb"><span class="bc-link" onclick="goTo('dashboard')">Дашбоард</span><span>/</span><span>Зочин</span></div><div class="page-header"><div><div class="page-title">Зочны бүртгэл</div><div class="page-sub">ERD: visitors — first_name, last_name, organisation_name, permit, status</div></div><button class="btn-add" onclick="document.getElementById('visitorId').value='';openModal('visitorModal')">Зочин бүртгэх</button></div><div class="table-wrap"><div class="table-toolbar"><div class="search-wrap"><span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg></span><input type="text" placeholder="Хайх..." oninput="filterTable('visitorsTable',this.value)" /></div><button class="filter-chip on" onclick="filterByStatus('visitorsTable','',this)">Бүгд</button><button class="filter-chip" onclick="filterByStatus('visitorsTable','Байгаа',this)">Байгаа</button><button class="filter-chip" onclick="filterByStatus('visitorsTable','Гарсан',this)">Гарсан</button></div><div class="table-scroll"><table id="visitorsTable"><thead><tr><th>visitor_id</th><th>created_at</th><th>first_name</th><th>last_name</th><th>organisation</th><th>purpose</th><th>schedule</th><th>responsible</th><th>status</th><th>Үйлдэл</th></tr></thead><tbody id="visitorsBody"></tbody></table></div><div class="table-foot"><span id="visitorsCount">Нийт 0 бүртгэл</span><span>visitors collection</span></div></div></main><footer class="page-footer"><span>ICN</span><span>visitors API</span></footer>
  </div>
  <div class="overlay hidden" id="visitorModal"><div class="modal"><div class="modal-top-bar"></div><div class="modal-head"><div class="modal-title">Зочин бүртгэх — visitors</div><button class="modal-close" onclick="closeModal('visitorModal')">×</button></div><form onsubmit="submitVisitor(event)"><div class="modal-body"><input type="hidden" id="visitorId" /><div class="form-row"><div class="form-group"><label class="form-label">first_name</label><input class="form-input" id="visitorFirstName" required /></div><div class="form-group"><label class="form-label">last_name</label><input class="form-input" id="visitorLastName" /></div></div><div class="form-row"><div class="form-group"><label class="form-label">organisation_name</label><input class="form-input" id="visitorOrg" /></div><div class="form-group"><label class="form-label">register_no</label><input class="form-input" id="visitorRegister" /></div></div><div class="form-row"><div class="form-group"><label class="form-label">purpose</label><input class="form-input" id="visitorPurpose" required /></div><div class="form-group"><label class="form-label">responsible_employee FK</label><select class="form-select" id="visitorResponsible"></select></div></div><div class="form-group"><label class="form-label">status</label><select class="form-select" id="visitorStatus"><option>Байгаа</option><option>Гарсан</option><option>Хүлээгдэж буй</option><option>Цуцлагдсан</option></select></div></div><div class="modal-foot"><button type="button" class="btn-cancel" onclick="closeModal('visitorModal')">Болих</button><button class="btn-save">Бүртгэх</button></div></form></div></div>
  <script src="../js/api.js"></script><script src="../js/app.js"></script><script src="../js/visitors.js"></script>
</body>
</html>
