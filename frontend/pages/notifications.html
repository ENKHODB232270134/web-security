<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICN Security — Мэдэгдэл</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/dashboard.css" /><link rel="stylesheet" href="../css/modal.css" />
</head>
<body data-protected="true" data-page="notifications">
  <div class="toast-container" id="toastContainer"></div><div class="page-shell"><nav class="topbar"><div class="topbar-left"><button class="back-btn" onclick="goTo('dashboard')">Буцах</button><a class="topbar-logo" onclick="goTo('dashboard')"><div class="topbar-shield"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg></div><span class="topbar-title">ICN SECURITY</span></a><div class="topbar-div"></div><span class="topbar-sys">notifications</span></div><div class="topbar-right"><span class="topbar-clock" data-clock></span><div class="user-badge"><div class="u-dot" data-user-dot></div><div><div class="u-name" data-user-name></div><div class="u-role" data-user-role></div></div></div><button class="logout-btn" onclick="doLogout()">Гарах</button></div></nav>
    <main class="content"><div class="breadcrumb"><span class="bc-link" onclick="goTo('dashboard')">Дашбоард</span><span>/</span><span>Мэдэгдэл</span></div><div class="page-header"><div><div class="page-title">Мэдэгдлийн систем</div><div class="page-sub">ERD: notifications — user_id FK, incident_id FK, title, message, status, sent_at</div></div><button class="btn-add" onclick="openModal('notificationModal')">Мэдэгдэл илгээх</button></div><div class="notif-list" id="notificationsList"></div></main><footer class="page-footer"><span>ICN</span><span>notifications API</span></footer></div>
  <div class="overlay hidden" id="notificationModal"><div class="modal"><div class="modal-top-bar"></div><div class="modal-head"><div class="modal-title">Мэдэгдэл илгээх — notifications</div><button class="modal-close" onclick="closeModal('notificationModal')">×</button></div><form onsubmit="submitNotification(event)"><div class="modal-body"><div class="form-group"><label class="form-label">title</label><input class="form-input" id="notificationTitle" required /></div><div class="form-row"><div class="form-group"><label class="form-label">type</label><select class="form-select" id="notificationType"><option>Яаралтай</option><option>Анхааруулга</option><option>Мэдээлэл</option></select></div><div class="form-group"><label class="form-label">user_id FK</label><select class="form-select" id="notificationUser"></select></div></div><div class="form-group"><label class="form-label">message</label><textarea class="form-textarea" id="notificationMessage" required></textarea></div></div><div class="modal-foot"><button type="button" class="btn-cancel" onclick="closeModal('notificationModal')">Болих</button><button class="btn-save">Илгээх</button></div></form></div></div>
  <script src="../js/api.js"></script><script src="../js/theme.js"></script><script src="../js/app.js"></script><script src="../js/users.js"></script>
</body>
</html>
